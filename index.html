<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3b5bfd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>第三方科技 · ThirdHub</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/base.css?v=1.0">
<link rel="stylesheet" href="css/theme.css?v=1.0">
<link rel="stylesheet" href="css/layout.css?v=1.0">
<link rel="stylesheet" href="css/discover.css?v=1.0">
<link rel="stylesheet" href="css/ai-chat.css?v=1.0">
<link rel="stylesheet" href="css/bookshelf.css?v=1.0">
<link rel="stylesheet" href="css/category.css?v=1.0">
<link rel="stylesheet" href="css/profile.css?v=1.0">
<link rel="stylesheet" href="css/novel-reader.css?v=1.0">
<link rel="stylesheet" href="css/comic-reader.css?v=1.0">
<link rel="stylesheet" href="css/player.css?v=1.0">
</head>
<body data-theme="dark">

<div id="app">
  <!-- 顶部状态栏占位（PWA 安全区） -->
  <div class="safe-top"></div>

  <!-- 页面容器 -->
  <main id="pages">
    <section class="page" id="page-discover"></section>
    <section class="page" id="page-ai"></section>
    <section class="page" id="page-bookshelf"></section>
    <section class="page" id="page-category"></section>
    <section class="page" id="page-profile"></section>
  </main>

  <!-- 底部导航 -->
  <nav id="tabbar">
    <button class="tab" data-tab="discover"><span class="tab-ico" data-ico="compass"></span><span class="tab-label">发现</span></button>
    <button class="tab" data-tab="ai"><span class="tab-ico" data-ico="robot"></span><span class="tab-label">AI</span></button>
    <button class="tab" data-tab="bookshelf"><span class="tab-ico" data-ico="books"></span><span class="tab-label">书架</span></button>
    <button class="tab" data-tab="category"><span class="tab-ico" data-ico="grid"></span><span class="tab-label">分类</span></button>
    <button class="tab" data-tab="profile"><span class="tab-ico" data-ico="user"></span><span class="tab-label">我的</span></button>
  </nav>
</div>

<!-- 全屏覆盖层：阅读器 / 播放器 / 详情 -->
<div id="overlay-root"></div>
<!-- 弹窗根节点 -->
<div id="modal-root"></div>
<!-- Toast 根节点 -->
<div id="toast-root"></div>

<script type="module" src="js/app.js?v=1.0"></script>
</body>
</html>
