<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3b5bfd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>第三方科技 · ThirdHub</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/base.css?v=9.1">
<link rel="stylesheet" href="css/theme.css?v=9.1">
<link rel="stylesheet" href="css/layout.css?v=9.1">
<link rel="stylesheet" href="css/adapt.css?v=9.1">
<style>
  /* v9.1 启动闪屏:限制图标尺寸,淡出过渡(修复刷新时巨大图标) */
  #boot-splash{position:fixed;inset:0;background:var(--bg,#0f1115);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .35s ease}
  #boot-splash .bs-logo{width:96px;height:96px;border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  #boot-splash .bs-logo img{width:100%;height:100%;object-fit:cover;display:block}
  #boot-splash .bs-name{font-size:15px;font-weight:700;color:#e8eaf0;letter-spacing:.5px}
</style>
</head>
<body data-theme="dark"><div id="boot-splash"><div class="bs-logo"><img src="icons/launcher.png" alt="ThirdHub"></div><div class="bs-name">ThirdHub</div><div class="bs-sub">第三方科技 · 一个入口</div><div class="bs-spin"></div></div>

<div id="app">
  <!-- 顶部状态栏占位（PWA 安全区） -->
  <div class="safe-top"></div>

  <!-- 页面容器（板块按用户选择动态生成） -->
  <main id="pages"></main>

  <!-- 底部导航（板块按用户选择动态生成） -->
  <nav id="tabbar"></nav>
</div>

<!-- 全屏覆盖层：阅读器 / 播放器 / 详情 -->
<div id="overlay-root"></div>
<!-- 弹窗根节点 -->
<div id="modal-root"></div>
<!-- Toast 根节点 -->
<div id="toast-root"></div>

<script type="module" src="js/app.js?v=9.1"></script>
</body>
</html>
